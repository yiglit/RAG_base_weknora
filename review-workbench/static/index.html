<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人工校对工作台</title>
<style>
  :root {
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #ffffff;
    --panel: #fafafa;
    --green: #15803d;
    --green-bg: #e8f5ec;
    --yellow: #a16207;
    --yellow-bg: #fef7e0;
    --red: #b91c1c;
    --red-bg: #fdecec;
    --blue: #1d4ed8;
    --blue-bg: #eef2ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  .doc-select {
    min-width: 280px;
    max-width: 420px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }
  .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); flex-wrap: wrap; }
  .meta b { color: var(--ink); font-weight: 600; }
  .meta .sep { color: #c0c4cc; }

  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(380px, 46%) minmax(0, 1fr);
    gap: 0;
  }
  .field-panel {
    min-height: 0;
    overflow-y: auto;
    padding: 12px 14px 20px;
    border-right: 1px solid var(--line);
    background: var(--panel);
  }
  .source-panel {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .source-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
  }
  .source-head b { color: var(--ink); font-weight: 600; }
  .source-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .source-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source-tools { display: flex; align-items: center; gap: 10px; flex: none; }
  .view-switch { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .view-switch button {
    padding: 3px 12px;
    border: none;
    background: #fff;
    color: var(--muted);
  }
  .view-switch button + button { border-left: 1px solid var(--line); }
  .view-switch button.active { background: var(--ink); color: #fff; }
  .view-switch button:disabled { opacity: .45; cursor: default; }
  .page-nav { display: flex; align-items: center; gap: 8px; }
  .page-nav[hidden] { display: none; }
  .source-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 14px 18px 60px;
  }
  .source-text {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: Consolas, "Courier New", "Microsoft YaHei", monospace;
    font-size: 13px;
    line-height: 1.75;
  }
  .source-text[hidden] { display: none; }
  .source-text mark {
    background: #fff1a8;
    border-radius: 2px;
    padding: 0 1px;
    transition: background .3s ease;
  }
  .source-text mark.flash { background: #ffd54f; }

  .original-wrap { min-height: 100%; }
  .original-wrap[hidden] { display: none; }
  .original-stage {
    position: relative;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 1px 6px rgba(15, 23, 42, .08);
  }
  .original-stage img { display: block; width: 100%; height: auto; }
  .original-overlay { position: absolute; inset: 0; pointer-events: none; }
  .bbox-box {
    position: absolute;
    border: 1.5px solid rgba(29, 78, 216, .6);
    background: rgba(29, 78, 216, .1);
    border-radius: 2px;
    transition: background .15s ease, border-color .15s ease;
  }
  .bbox-box.active {
    border-color: #b45309;
    background: rgba(251, 191, 36, .3);
    box-shadow: 0 0 0 2px rgba(251, 191, 36, .45);
  }
  .original-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, .86);
    color: var(--muted);
    font-size: 12.5px;
  }
  .original-hint[hidden] { display: none; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 3px solid #d1d5db;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover { box-shadow: 0 1px 4px rgba(15, 23, 42, .06); }
  .card.active { border-color: var(--blue); border-left-color: var(--blue); box-shadow: 0 0 0 1px var(--blue-bg); }
  .card.status-ok { border-left-color: var(--green); background: #fcfdfc; }
  .card.status-reject { border-left-color: var(--red); }
  .card.empty { background: #fff7f7; }
  .card.empty.status-ok, .card.empty.status-reject { background: #fff7f7; }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .name { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name b { font-size: 13.5px; font-weight: 600; }
  .name .en { color: var(--muted); font-size: 12px; font-family: Consolas, "Courier New", monospace; }
  .conf {
    flex: none;
    font-size: 11.5px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .conf.green { color: var(--green); background: var(--green-bg); border-color: #c6e8d0; }
  .conf.yellow { color: var(--yellow); background: var(--yellow-bg); border-color: #f0dda0; }
  .conf.red { color: var(--red); background: var(--red-bg); border-color: #f2caca; }

  .field-input {
    width: 100%;
    margin: 8px 0 6px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    outline: none;
  }
  .field-input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-bg); }
  .field-input::placeholder { color: #b0b5bd; }

  .basis { color: var(--muted); font-size: 11.5px; line-height: 1.6; }
  .basis .okmark { color: var(--green); }
  .basis .badmark { color: var(--red); }

  .quote {
    margin: 6px 0 0;
    padding: 5px 8px;
    background: #f3f4f6;
    border-radius: 5px;
    color: #4b5563;
    font-size: 11.5px;
    line-height: 1.5;
    word-break: break-word;
  }
  .quote.muted { color: #9aa0a6; }

  .loc { margin-top: 5px; color: var(--muted); font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }
  .state {
    margin-right: auto;
    font-size: 11.5px;
    padding: 1px 7px;
    border-radius: 999px;
    color: var(--muted);
    background: #f3f4f6;
  }
  .state.ok { color: var(--green); background: var(--green-bg); }
  .state.reject { color: var(--red); background: var(--red-bg); }
  .empty-tag {
    font-size: 11px;
    color: var(--red);
    background: var(--red-bg);
    border-radius: 4px;
    padding: 0 6px;
  }
  .btn-ok, .btn-reject {
    padding: 3px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
  }
  .btn-ok:hover { border-color: var(--green); color: var(--green); }
  .btn-reject:hover { border-color: var(--red); color: var(--red); }
  .btn-ok.active { background: var(--green); border-color: var(--green); color: #fff; }
  .btn-reject.active { background: var(--red); border-color: var(--red); color: #fff; }

  .bottombar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 9px 16px;
    border-top: 1px solid var(--line);
    background: #fff;
  }
  .hint { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 8px; }
  .actions button {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
  }
  .actions button:hover { background: #f5f6f7; }
  .actions .primary {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .actions .primary:hover { background: #333a41; }
  .actions button:disabled { opacity: .55; cursor: default; }

  .toast {
    position: fixed;
    top: 64px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    max-width: 70vw;
    padding: 8px 16px;
    border-radius: 6px;
    background: var(--yellow-bg);
    border: 1px solid #eab308;
    color: #7c5e10;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
    opacity: 0;
    visibility: hidden;
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
    z-index: 99;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

  .muted { color: var(--muted); }

  .nav-btn {
    flex: none;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }
  .nav-btn:hover { background: #f5f6f7; }
  .nav-btn:disabled { opacity: .4; cursor: default; }

  .progress { flex: none; display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .progress .bar { width: 120px; height: 6px; border-radius: 999px; background: #eceef1; overflow: hidden; }
  .progress .bar > i { display: block; height: 100%; width: 0; background: var(--green); transition: width .2s ease; }
  .progress .bar > i.has-reject { background: linear-gradient(90deg, var(--green), #d97706); }
  .counts { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .counts b { color: var(--ink); }

  .note-input {
    width: 100%;
    margin-top: 6px;
    padding: 5px 8px;
    border: 1px dashed #f2caca;
    border-radius: 6px;
    background: #fffafa;
    font-size: 12px;
    outline: none;
  }
  .note-input:focus { border-style: solid; border-color: var(--red); }
  .filter-toggle { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .field-missing { padding: 30px 10px; text-align: center; color: var(--muted); }
  .placeholder { padding: 40px 10px; text-align: center; color: var(--muted); }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .field-panel { border-right: none; border-bottom: 1px solid var(--line); }
    .doc-select { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>
<div id="toast" class="toast" role="status"></div>

<header class="topbar">
  <div class="brand">人工校对工作台</div>
  <button type="button" id="btnPrevDoc" class="nav-btn" title="上一份文档">◀</button>
  <select id="docSelect" class="doc-select" aria-label="选择文档"></select>
  <button type="button" id="btnNextDoc" class="nav-btn" title="下一份文档">▶</button>
  <div class="meta" id="meta"></div>
  <div class="progress">
    <span class="counts" id="counts"></span>
    <span class="bar"><i id="progressBar"></i></span>
  </div>
</header>

<main class="workspace">
  <section class="field-panel" id="fieldPanel">
    <div class="placeholder">请选择一份抽取结果</div>
  </section>
  <section class="source-panel">
    <div class="source-head">
      <div class="source-title">
        <b>原文</b>
        <span id="sourceFile" class="muted"></span>
      </div>
      <div class="source-tools">
        <div class="view-switch" id="viewSwitch">
          <button type="button" class="view-btn active" data-view="text">文本</button>
          <button type="button" class="view-btn" id="btnViewOriginal" data-view="original">原件</button>
        </div>
        <div class="page-nav" id="pageNav" hidden>
          <button type="button" id="btnPrevPage" class="nav-btn">上一页</button>
          <span id="pageLabel" class="counts">-</span>
          <button type="button" id="btnNextPage" class="nav-btn">下一页</button>
        </div>
      </div>
    </div>
    <div class="source-body" id="sourceBody">
      <div id="sourceText" class="source-text muted">（未加载）</div>
      <div id="sourceOriginal" class="original-wrap" hidden>
        <div class="original-stage" id="originalStage">
          <img id="originalImg" alt="原件页面">
          <div id="originalOverlay" class="original-overlay"></div>
          <div id="originalHint" class="original-hint" hidden></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="bottombar">
  <div class="hint" id="saveHint">尚未保存</div>
  <div class="actions">
    <label class="filter-toggle"><input type="checkbox" id="onlyUnreviewed"> 只看未审</label>
    <button type="button" id="btnNextPending">下一个未审 (J)</button>
    <button type="button" id="btnAllOk">全部通过</button>
    <button type="button" id="btnHighConf">仅通过高置信(≥0.8)</button>
    <button type="button" id="btnSave" class="primary">保存</button>
    <button type="button" id="btnPublish" class="primary" disabled>确认入库</button>
  </div>
</footer>

<script>
(function () {
  'use strict';

  var FIELD_DEFS = [
    { name: 'cert_no', label: '证书编号' },
    { name: 'institution', label: '发证机构' },
    { name: 'manufacturer', label: '制造商' },
    { name: 'product_name', label: '产品名称' },
    { name: 'model_spec', label: '规格型号' },
    { name: 'ex_marking', label: '防爆标志' },
    { name: 'standard', label: '执行标准' },
    { name: 'drawing_no', label: '图样编号' },
    { name: 'issue_date', label: '发证日期' },
    { name: 'valid_until', label: '有效期至' },
    { name: 'voltage', label: '额定电压' },
    { name: 'current', label: '额定电流' },
    { name: 'enclosure', label: '外壳材质' }
  ];

  var state = {
    docs: [],
    currentId: '',
    doc: null,
    fields: {},
    markdown: '',
    values: {},
    status: {},
    notes: {},
    active: '',
    onlyUnreviewed: false,
    view: 'text',
    page: 1,
    original: { available: false, pages: 0, focus: '', token: 0, loadedPage: 0 }
  };

  var el = function (id) { return document.getElementById(id); };
  var fieldPanel = el('fieldPanel');
  var sourceText = el('sourceText');
  var sourceBody = el('sourceBody');
  var sourceOriginal = el('sourceOriginal');
  var originalStage = el('originalStage');
  var originalImg = el('originalImg');
  var originalOverlay = el('originalOverlay');
  var originalHint = el('originalHint');
  var toastTimer = null;

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
  }

  function toast(message) {
    var node = el('toast');
    node.textContent = message;
    node.className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.className = 'toast'; }, 3400);
  }

  async function api(path, options) {
    var resp = await fetch(path, options);
    var data = {};
    try { data = await resp.json(); } catch (err) { data = {}; }
    if (!resp.ok) {
      throw new Error(data.error || ('HTTP ' + resp.status));
    }
    return data;
  }

  function defaultInput(item) {
    if (!item) return '';
    if (item.value !== undefined && item.value !== null && String(item.value) !== '') {
      return String(item.value);
    }
    if (Array.isArray(item.values)) {
      return item.values.join(' / ');
    }
    return '';
  }

  function isBlank(item) {
    if (!item) return true;
    var hasValue = item.value !== undefined && item.value !== null && String(item.value).trim() !== '';
    var hasValues = Array.isArray(item.values) && item.values.some(function (v) {
      return String(v).trim() !== '';
    });
    return !hasValue && !hasValues;
  }

  function confidenceOf(item) {
    if (!item || typeof item.confidence !== 'number' || isNaN(item.confidence)) return null;
    return item.confidence;
  }

  function confidenceClass(conf) {
    if (conf === null) return 'red';
    if (conf >= 0.8) return 'green';
    if (conf >= 0.6) return 'yellow';
    return 'red';
  }

  function renderBasis(item) {
    var basis = item && item.confidence_basis;
    if (!basis) return '<div class="basis"><span class="muted">无置信依据</span></div>';
    var model = typeof basis.model === 'number' ? basis.model.toFixed(2) : '—';
    var mark = function (ok) {
      return ok ? '<span class="okmark">✓</span>' : '<span class="badmark">✗</span>';
    };
    return '<div class="basis">模型 ' + esc(model) +
      ' · 值∈quote ' + mark(basis.value_in_quote) +
      ' · quote∈原文 ' + mark(basis.quote_in_text) +
      ' · 格式 ' + mark(basis.format_ok) + '</div>';
  }

  function renderField(def) {
    var item = state.fields[def.name] || {};
    var conf = confidenceOf(item);
    var cls = confidenceClass(conf);
    var status = state.status[def.name] || '';
    var empty = isBlank(item);
    var value = state.values[def.name];
    if (value === undefined) value = defaultInput(item);

    var classes = ['card'];
    if (status === 'ok') classes.push('status-ok');
    if (status === 'reject') classes.push('status-reject');
    if (empty) classes.push('empty');
    if (state.active === def.name) classes.push('active');

    var statusText = status === 'ok' ? '已通过' : (status === 'reject' ? '已驳回' : '未审');
    var statusCls = status === 'ok' ? 'ok' : (status === 'reject' ? 'reject' : '');

    var quote = item.quote ? String(item.quote) : '';
    var loc = [];
    if (item.page !== undefined && item.page !== null) loc.push('第 ' + item.page + ' 页');
    if (Array.isArray(item.bbox) && item.bbox.length) loc.push('bbox [' + item.bbox.join(', ') + ']');
    if (!loc.length) loc.push('无页码');

    var html = '' +
      '<article class="' + classes.join(' ') + '" data-field="' + esc(def.name) + '">' +
        '<div class="card-head">' +
          '<div class="name">' +
            '<b>' + esc(def.label) + '</b>' +
            '<span class="en">' + esc(def.name) + '</span>' +
            (empty ? '<span class="empty-tag">未抽到</span>' : '') +
          '</div>' +
          '<span class="conf ' + cls + '">' + (conf === null ? '无置信' : conf.toFixed(2)) + '</span>' +
        '</div>' +
        '<input class="field-input" type="text" data-field="' + esc(def.name) + '" ' +
          'value="' + esc(value) + '" placeholder="' + (empty ? '未抽到，请人工填写' : '字段值') + '">' +
        renderBasis(item) +
        (quote
          ? '<blockquote class="quote">' + esc(quote) + '</blockquote>'
          : '<blockquote class="quote muted">（无引用片段）</blockquote>') +
        '<div class="loc"><span>' + esc(loc.join(' · ')) + '</span></div>' +
        (status === 'reject'
          ? '<input class="note-input" type="text" data-note="' + esc(def.name) + '" ' +
            'placeholder="驳回原因（可选，便于复核）" value="' + esc(state.notes[def.name] || '') + '">'
          : '') +
        '<div class="card-foot">' +
          '<span class="state ' + statusCls + '">' + statusText + '</span>' +
          '<button type="button" class="btn-ok' + (status === 'ok' ? ' active' : '') + '" data-act="ok">通过</button>' +
          '<button type="button" class="btn-reject' + (status === 'reject' ? ' active' : '') + '" data-act="reject">驳回</button>' +
        '</div>' +
      '</article>';
    return html;
  }

  function renderFields() {
    if (!state.doc) {
      fieldPanel.innerHTML = '<div class="placeholder">请选择一份抽取结果</div>';
      renderProgress();
      return;
    }
    var defs = FIELD_DEFS.filter(function (def) {
      if (!state.onlyUnreviewed) return true;
      var st = state.status[def.name];
      return st !== 'ok' && st !== 'reject';
    });
    if (!defs.length) {
      fieldPanel.innerHTML = '<div class="field-missing">所有字段都已标记。<br>取消「只看未审」可继续修改。</div>';
    } else {
      fieldPanel.innerHTML = defs.map(renderField).join('');
    }
    renderProgress();
  }

  function reviewCounts() {
    var ok = 0;
    var reject = 0;
    FIELD_DEFS.forEach(function (def) {
      var st = state.status[def.name];
      if (st === 'ok') ok += 1;
      else if (st === 'reject') reject += 1;
    });
    return { ok: ok, reject: reject, reviewed: ok + reject, total: FIELD_DEFS.length };
  }

  function renderProgress() {
    var c = reviewCounts();
    el('counts').innerHTML = '已审 <b>' + c.reviewed + '/' + c.total + '</b> · 通过 ' + c.ok + ' · 驳回 ' + c.reject;
    var bar = el('progressBar');
    bar.style.width = Math.round(c.reviewed / c.total * 100) + '%';
    bar.className = c.reject > 0 ? 'has-reject' : '';
    updatePublishButton();
  }

  function canPublish() {
    if (!state.doc) return false;
    var c = reviewCounts();
    return c.reviewed === c.total && c.reject === 0;
  }

  function updatePublishButton() {
    var button = el('btnPublish');
    var c = reviewCounts();
    var ready = canPublish();
    button.disabled = !ready;
    button.title = ready
      ? '将 13 个字段写入参数卡并同步知识库'
      : (c.reject > 0 ? '存在被驳回的字段，请修正后通过' : '请先完成全部字段审核');
  }

  function pendingFields() {
    return FIELD_DEFS.filter(function (def) {
      var st = state.status[def.name];
      return st !== 'ok' && st !== 'reject';
    });
  }

  function renderMeta(doc, summary) {
    var stats = doc.stats || {};
    var total = stats.fields_total || FIELD_DEFS.length;
    var filled = stats.filled || 0;
    var avg = typeof stats.avg_confidence === 'number' ? stats.avg_confidence.toFixed(3) : '0.000';
    var parts = [
      { bold: true, text: (doc.source_file || doc.knowledge_id || '') },
      { text: doc.extracted_at ? '抽取时间 ' + doc.extracted_at.replace('T', ' ') : '' },
      { text: filled + '/' + total },
      { text: '平均置信 ' + avg }
    ];
    if (summary && summary.status) parts.push({ text: summary.status });

    el('meta').innerHTML = parts.filter(function (p) { return p.text; }).map(function (p) {
      return p.bold ? '<b>' + esc(p.text) + '</b>' : '<span>' + esc(p.text) + '</span>';
    }).join('<span class="sep">·</span>');
    el('sourceFile').textContent = doc.source_file || '';
  }

  function renderSource(markdown) {
    state.markdown = markdown || '';
    if (!state.markdown) {
      sourceText.className = 'source-text muted';
      sourceText.textContent = '（该文档没有原文）';
      return;
    }
    sourceText.className = 'source-text';
    sourceText.innerHTML = esc(state.markdown);
  }

  var SQUASH_MAP = {
    '：': ':', '，': ',', '；': ';', '（': '(', '）': ')', '、': ',', '。': '.',
    '％': '%', '　': '', '－': '-', '～': '~', '！': '!', '？': '?'
  };
  var SQUASH_RULES = [
    ['(?:∥|‖|\\|\\|)\\s*([ABC])', 'g', 'Ⅱ$1'],
    ['III\\s*([ABC])', 'gi', 'Ⅲ$1'],
    ['II\\s*([ABC])', 'gi', 'Ⅱ$1'],
    ['(Ⅱ|Ⅲ)\\s*([ABC])', 'g', '$1$2'],
    ['T\\s*(\\d{2,3})\\s*[C℃]', 'g', 'T$1℃'],
    ['(\\d{2,3})\\s*(?:°\\s*C|[oO]\\s*C)', 'g', '$1℃']
  ];

  // 与后端 _squash 保持一致：全角转半角、符号归一、去空白，
  // 并记录归一化字符到原文下标的映射，便于回填高亮。
  function squashWithMap(text) {
    var str = String(text || '');
    var map = [];
    var translated = '';
    for (var i = 0; i < str.length; i++) {
      var ch = str.charAt(i);
      var mapped = Object.prototype.hasOwnProperty.call(SQUASH_MAP, ch) ? SQUASH_MAP[ch] : ch;
      if (mapped === '') continue;
      translated += mapped;
      map.push(i);
    }
    str = translated;
    SQUASH_RULES.forEach(function (rule) {
      var re = new RegExp(rule[0], rule[1]);
      var out = '';
      var outMap = [];
      var last = 0;
      var m;
      while ((m = re.exec(str)) !== null) {
        out += str.slice(last, m.index);
        for (var k = last; k < m.index; k++) outMap.push(map[k]);
        var replaced = m[0].replace(new RegExp(rule[0], rule[1]), rule[2]);
        for (var j = 0; j < replaced.length; j++) outMap.push(map[m.index]);
        out += replaced;
        last = m.index + m[0].length;
        if (m[0].length === 0) re.lastIndex += 1;
      }
      out += str.slice(last);
      for (var k2 = last; k2 < str.length; k2++) outMap.push(map[k2]);
      str = out;
      map = outMap;
    });
    var finalText = '';
    var finalMap = [];
    for (var n = 0; n < str.length; n++) {
      if (!/\s/.test(str.charAt(n))) {
        finalText += str.charAt(n);
        finalMap.push(map[n]);
      }
    }
    return { text: finalText, map: finalMap };
  }

  function findRange(raw, needle) {
    if (!needle) return null;
    var exact = raw.indexOf(needle);
    if (exact !== -1) return { start: exact, end: exact + needle.length };
    var hay = squashWithMap(raw);
    var pin = squashWithMap(needle).text;
    if (!pin) return null;
    var pos = hay.text.indexOf(pin);
    if (pos === -1) return null;
    return { start: hay.map[pos], end: hay.map[pos + pin.length - 1] + 1 };
  }

  function highlightRange(raw, range) {
    sourceText.className = 'source-text';
    sourceText.innerHTML = esc(raw.slice(0, range.start)) +
      '<mark>' + esc(raw.slice(range.start, range.end)) + '</mark>' +
      esc(raw.slice(range.end));
    var first = sourceText.querySelector('mark');
    if (first) {
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      first.classList.add('flash');
      setTimeout(function () { first.classList.remove('flash'); }, 1200);
    }
  }

  function locateQuote(quote, value) {
    var raw = state.markdown || '';
    if (!raw) {
      renderSource(raw);
      return;
    }

    var exactQuote = quote ? String(quote) : '';
    var probe = value === undefined || value === null ? '' : String(value).trim();
    var candidates = [];
    if (exactQuote) candidates.push({ needle: exactQuote, byValue: false });
    if (probe && probe !== exactQuote) candidates.push({ needle: probe, byValue: true });

    for (var i = 0; i < candidates.length; i++) {
      var range = findRange(raw, candidates[i].needle);
      if (range) {
        highlightRange(raw, range);
        if (candidates[i].byValue) toast('quote 未命中原文，已按字段值定位');
        return;
      }
    }

    renderSource(raw);
    toast(exactQuote ? '该字段的 quote 与字段值都未在原文中命中' : '该字段没有 quote，无法定位');
  }

  function fieldLabel(name) {
    for (var i = 0; i < FIELD_DEFS.length; i++) {
      if (FIELD_DEFS[i].name === name) return FIELD_DEFS[i].label;
    }
    return name;
  }

  function normalizeBox(bbox) {
    if (!Array.isArray(bbox) || bbox.length !== 4) return null;
    var nums = bbox.map(Number);
    for (var i = 0; i < 4; i++) {
      if (!isFinite(nums[i])) return null;
    }
    var clamp = function (v) { return Math.max(0, Math.min(1, v)); };
    var x0 = clamp(Math.min(nums[0], nums[2]));
    var x1 = clamp(Math.max(nums[0], nums[2]));
    var y0 = clamp(Math.min(nums[1], nums[3]));
    var y1 = clamp(Math.max(nums[1], nums[3]));
    if (x1 - x0 < 0.002 || y1 - y0 < 0.002) return null;
    return [x0, y0, x1, y1];
  }

  function hasRegion(item) {
    if (!item || item.page === undefined || item.page === null) return false;
    var page = Number(item.page);
    if (!isFinite(page) || page < 1) return false;
    return !!normalizeBox(item.bbox);
  }

  function originalUrl(page) {
    return '/api/docs/' + encodeURIComponent(state.currentId) + '/page/' + page + '.png';
  }

  function updateViewButtons() {
    var button = el('btnViewOriginal');
    button.disabled = !state.original.available;
    button.title = state.original.available ? '查看 PDF 原件' : '该文档暂无可用原件';
  }

  function updatePageNav() {
    var nav = el('pageNav');
    var on = state.view === 'original' && state.original.available;
    nav.hidden = !on;
    if (!on) return;
    var pages = state.original.pages || 1;
    el('pageLabel').textContent = '第 ' + state.page + ' / ' + pages + ' 页';
    el('btnPrevPage').disabled = state.page <= 1;
    el('btnNextPage').disabled = state.page >= pages;
  }

  function setView(view) {
    if (view === 'original' && !state.original.available) return;
    state.view = view;
    sourceText.hidden = view !== 'text';
    sourceOriginal.hidden = view !== 'original';
    var buttons = el('viewSwitch').querySelectorAll('.view-btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-view') === view);
    }
    updatePageNav();
  }

  function scrollBoxIntoView(box) {
    if (!box) return;
    var bodyRect = sourceBody.getBoundingClientRect();
    var boxRect = box.getBoundingClientRect();
    var top = boxRect.top - bodyRect.top + sourceBody.scrollTop -
      (sourceBody.clientHeight - boxRect.height) / 2;
    sourceBody.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }

  function renderOverlay() {
    originalOverlay.innerHTML = '';
    if (state.view !== 'original' || !state.original.available) return;
    if (state.original.loadedPage !== state.page) return;
    var activeBox = null;
    FIELD_DEFS.forEach(function (def) {
      var item = state.fields[def.name];
      if (!hasRegion(item) || Number(item.page) !== state.page) return;
      var box = normalizeBox(item.bbox);
      if (!box) return;
      var node = document.createElement('div');
      node.className = 'bbox-box' + (state.original.focus === def.name ? ' active' : '');
      node.style.left = (box[0] * 100).toFixed(3) + '%';
      node.style.top = (box[1] * 100).toFixed(3) + '%';
      node.style.width = ((box[2] - box[0]) * 100).toFixed(3) + '%';
      node.style.height = ((box[3] - box[1]) * 100).toFixed(3) + '%';
      var value = state.values[def.name];
      node.title = fieldLabel(def.name) + (value ? '：' + value : '');
      originalOverlay.appendChild(node);
      if (state.original.focus === def.name) activeBox = node;
    });
    scrollBoxIntoView(activeBox);
  }

  function loadOriginalPage(page) {
    if (!state.original.available) return;
    var pages = state.original.pages || 1;
    var target = Math.max(1, Math.min(pages, Number(page) || 1));
    state.page = target;
    state.original.loadedPage = 0;
    var token = ++state.original.token;
    var url = originalUrl(target);
    originalOverlay.innerHTML = '';
    updatePageNav();

    if (originalImg.getAttribute('src') === url && originalImg.complete && originalImg.naturalWidth) {
      state.original.loadedPage = target;
      originalHint.hidden = true;
      renderOverlay();
      return;
    }

    originalHint.hidden = false;
    originalHint.textContent = '正在加载第 ' + target + ' 页…';
    originalImg.onload = function () {
      if (token !== state.original.token) return;
      state.original.loadedPage = target;
      originalHint.hidden = true;
      renderOverlay();
      updatePageNav();
    };
    originalImg.onerror = function () {
      if (token !== state.original.token) return;
      state.original.loadedPage = 0;
      originalHint.hidden = false;
      originalHint.textContent = '第 ' + target + ' 页渲染失败';
    };
    originalImg.src = url;
  }

  function showRegion(name) {
    var item = state.fields[name] || {};
    state.original.focus = name;
    setView('original');
    loadOriginalPage(Number(item.page));
  }

  function resetOriginal() {
    state.original = {
      available: false,
      pages: 0,
      focus: '',
      token: state.original.token + 1,
      loadedPage: 0
    };
    state.page = 1;
    state.view = 'text';
    sourceText.hidden = false;
    sourceOriginal.hidden = true;
    originalOverlay.innerHTML = '';
    originalHint.hidden = true;
    originalImg.removeAttribute('src');
    var buttons = el('viewSwitch').querySelectorAll('.view-btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-view') === 'text');
    }
    updateViewButtons();
    updatePageNav();
  }

  function loadOriginalInfo(kid) {
    updateViewButtons();
    api('/api/docs/' + encodeURIComponent(kid) + '/original').then(function (info) {
      if (state.currentId !== kid) return;
      state.original.available = !!(info && info.available);
      state.original.pages = Number(info && info.pages) || 0;
      updateViewButtons();
    }).catch(function () {
      if (state.currentId !== kid) return;
      state.original.available = false;
      state.original.pages = 0;
      updateViewButtons();
    });
  }

  function pageStep(delta) {
    if (state.view !== 'original') return;
    loadOriginalPage(state.page + delta);
  }

  function selectField(name) {
    state.active = name;
    var cards = fieldPanel.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.toggle('active', cards[i].getAttribute('data-field') === name);
    }
    var item = state.fields[name] || {};
    var edited = state.values[name];
    if (hasRegion(item) && state.original.available) {
      showRegion(name);
      return;
    }
    if (state.view === 'original') setView('text');
    locateQuote(item.quote ? String(item.quote) : '', edited === undefined ? defaultInput(item) : edited);
  }

  function setStatus(name, status) {
    state.status[name] = state.status[name] === status ? '' : status;
    state.active = name;
    renderFields();
    var card = fieldPanel.querySelector('.card[data-field="' + name + '"]');
    if (card) {
      card.classList.add('active');
      var input = card.querySelector('.field-input');
      if (input) input.value = state.values[name] === undefined ? '' : state.values[name];
    }
  }

  async function refreshDocs() {
    var docs = await api('/api/docs');
    state.docs = Array.isArray(docs) ? docs : [];
    var select = el('docSelect');
    if (!state.docs.length) {
      select.innerHTML = '<option value="">（results 目录暂无抽取结果）</option>';
      state.currentId = '';
      return;
    }
    select.innerHTML = state.docs.map(function (doc) {
      var label = (doc.source_file || doc.knowledge_id) + ' · ' + doc.filled + '/' + doc.total + ' · ' + doc.status;
      return '<option value="' + esc(doc.knowledge_id) + '">' + esc(label) + '</option>';
    }).join('');

    var exists = state.docs.some(function (doc) { return doc.knowledge_id === state.currentId; });
    if (!exists) state.currentId = state.docs[0].knowledge_id;
    select.value = state.currentId;
  }

  async function loadDoc(kid) {
    if (!kid) return;
    state.currentId = kid;
    var encoded = encodeURIComponent(kid);
    var results = await Promise.all([
      api('/api/docs/' + encoded),
      api('/api/docs/' + encoded + '/review')
    ]);
    var doc = results[0];
    var review = results[1] || {};

    state.doc = doc;
    state.fields = doc.fields || {};
    state.values = {};
    state.status = {};
    state.notes = {};
    state.active = '';

    var reviewFields = review.fields && typeof review.fields === 'object' ? review.fields : {};
    FIELD_DEFS.forEach(function (def) {
      var item = state.fields[def.name] || {};
      var saved = reviewFields[def.name];
      var savedValue = saved && typeof saved.value === 'string' ? saved.value : null;
      state.values[def.name] = savedValue !== null ? savedValue : defaultInput(item);
      state.status[def.name] = saved && (saved.status === 'ok' || saved.status === 'reject') ? saved.status : '';
      state.notes[def.name] = saved && saved.note ? String(saved.note) : '';
    });

    renderMeta(doc, state.docs.filter(function (d) { return d.knowledge_id === kid; })[0]);
    renderFields();
    renderSource(doc.markdown || '');
    resetOriginal();
    loadOriginalInfo(kid);
    el('saveHint').textContent = review.updated_at
      ? '上次保存 ' + String(review.updated_at).replace('T', ' ')
      : '尚未保存';
  }

  function markAll(mode) {
    if (!state.doc) { toast('请先选择文档'); return; }
    FIELD_DEFS.forEach(function (def) {
      if (mode === 'all') {
        state.status[def.name] = 'ok';
      } else {
        var conf = confidenceOf(state.fields[def.name]);
        state.status[def.name] = (conf !== null && conf >= 0.8) ? 'ok' : 'reject';
      }
    });
    renderFields();
    toast(mode === 'all' ? '已全部标记为通过，记得保存' : '高置信字段已通过，其余已驳回，记得保存');
  }

  async function saveReview(silent) {
    if (!state.currentId) {
      if (!silent) toast('请先选择文档');
      return null;
    }
    var fields = {};
    var count = 0;
    FIELD_DEFS.forEach(function (def) {
      var status = state.status[def.name];
      if (status !== 'ok' && status !== 'reject') return;
      fields[def.name] = {
        status: status,
        value: state.values[def.name] === undefined ? '' : state.values[def.name],
        note: state.notes[def.name] || ''
      };
      count += 1;
    });
    if (!count) {
      if (!silent) toast('请先标记要保存的字段');
      return null;
    }

    var button = el('btnSave');
    if (!silent) button.disabled = true;
    try {
      var res = await api('/api/docs/' + encodeURIComponent(state.currentId) + '/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: fields })
      });
      el('saveHint').textContent = '已写入 eval/field_labels.csv（' +
        res.labels_written + ' 个通过项，' + String(res.updated_at).replace('T', ' ') + '）';
      if (!silent) toast('已保存 ' + res.saved + ' 个字段，' + res.labels_written + ' 条标签写入 CSV');
      await refreshDocs();
      renderMeta(state.doc, state.docs.filter(function (d) {
        return d.knowledge_id === state.currentId;
      })[0]);
      return res;
    } catch (err) {
      if (!silent) toast('保存失败：' + err.message);
      throw err;
    } finally {
      if (!silent) button.disabled = false;
    }
  }

  function save() {
    saveReview(false).catch(function () {});
  }

  async function publishDoc() {
    if (!state.currentId) { toast('请先选择文档'); return; }
    if (!canPublish()) { toast('请先完成全部字段审核，且没有驳回字段'); return; }
    var button = el('btnPublish');
    button.disabled = true;
    try {
      await saveReview(true);
      var res = await api('/api/docs/' + encodeURIComponent(state.currentId) + '/publish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      });
      var pub = res.publish || {};
      var mode = pub.mode || '';
      var kid = pub.knowledge_id || '';
      var dbAction = pub.db_action || '';
      el('saveHint').textContent = '已入库（' + mode + '）· knowledge_id ' +
        (kid || '—') + (dbAction ? ' · ' + dbAction : '');
      toast('入库：' + mode + ' · knowledge_id ' + (kid || '—') +
        (dbAction ? ' · ' + dbAction : ''));
    } catch (err) {
      toast('入库失败：' + err.message);
    } finally {
      updatePublishButton();
    }
  }

  fieldPanel.addEventListener('click', function (event) {
    var button = event.target.closest('button[data-act]');
    if (button) {
      var card = button.closest('.card');
      if (card) setStatus(card.getAttribute('data-field'), button.getAttribute('data-act'));
      return;
    }
    var hit = event.target.closest('.card');
    if (hit) selectField(hit.getAttribute('data-field'));
  });

  function nextPending(dir) {
    if (!state.doc) { toast('请先选择文档'); return; }
    var pending = pendingFields();
    if (!pending.length) { toast('所有字段都已审完'); return; }
    var idx = -1;
    pending.forEach(function (def, i) { if (def.name === state.active) idx = i; });
    var target = pending[(idx + (dir || 1) + pending.length) % pending.length];
    var card = fieldPanel.querySelector('.card[data-field="' + target.name + '"]');
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('active');
    }
    selectField(target.name);
    if (card) {
      var input = card.querySelector('.field-input');
      if (input) input.focus();
    }
  }

  function docStep(delta) {
    if (!state.docs.length) { toast('暂无可切换的文档'); return; }
    var ids = state.docs.map(function (doc) { return doc.knowledge_id; });
    var idx = ids.indexOf(state.currentId);
    if (idx === -1) idx = 0;
    var next = ids[(idx + delta + ids.length) % ids.length];
    el('docSelect').value = next;
    loadDoc(next).catch(function (err) {
      toast('加载文档失败：' + err.message);
    });
  }

  fieldPanel.addEventListener('input', function (event) {
    var input = event.target;
    if (!input.classList) return;
    var card = input.closest('.card');
    if (!card) return;
    if (input.classList.contains('field-input')) {
      state.values[card.getAttribute('data-field')] = input.value;
    } else if (input.classList.contains('note-input')) {
      state.notes[card.getAttribute('data-field')] = input.value;
    }
  });

  document.addEventListener('keydown', function (event) {
    var tag = (event.target && event.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.key === 'j' || event.key === 'ArrowDown') {
      event.preventDefault();
      nextPending(1);
    } else if (event.key === 'k' || event.key === 'ArrowUp') {
      event.preventDefault();
      nextPending(-1);
    } else if (event.key === 'a' && state.active) {
      setStatus(state.active, 'ok');
    } else if (event.key === 'r' && state.active) {
      setStatus(state.active, 'reject');
    }
  });

  el('docSelect').addEventListener('change', function (event) {
    loadDoc(event.target.value).catch(function (err) {
      toast('加载文档失败：' + err.message);
    });
  });
  el('btnPrevDoc').addEventListener('click', function () { docStep(-1); });
  el('btnNextDoc').addEventListener('click', function () { docStep(1); });
  el('btnNextPending').addEventListener('click', function () { nextPending(1); });
  el('onlyUnreviewed').addEventListener('change', function (event) {
    state.onlyUnreviewed = !!event.target.checked;
    renderFields();
  });
  el('btnAllOk').addEventListener('click', function () { markAll('all'); });
  el('btnHighConf').addEventListener('click', function () { markAll('high'); });
  el('btnSave').addEventListener('click', save);
  el('btnPublish').addEventListener('click', publishDoc);

  el('viewSwitch').addEventListener('click', function (event) {
    var button = event.target.closest('button[data-view]');
    if (!button || button.disabled) return;
    var view = button.getAttribute('data-view');
    if (view === 'original') {
      if (!state.original.available) { toast('该文档暂无可用原件'); return; }
      setView('original');
      if (state.original.loadedPage !== state.page) loadOriginalPage(state.page);
    } else {
      setView('text');
    }
  });
  el('btnPrevPage').addEventListener('click', function () { pageStep(-1); });
  el('btnNextPage').addEventListener('click', function () { pageStep(1); });

  async function init() {
    try {
      await refreshDocs();
    } catch (err) {
      toast('加载文档列表失败：' + err.message);
      return;
    }
    if (state.currentId) {
      try {
        await loadDoc(state.currentId);
      } catch (err) {
        toast('加载文档失败：' + err.message);
      }
    }
  }

  init();
})();
</script>
